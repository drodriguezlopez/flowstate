openapi: 3.0.3
info:
  title: Task Management Query API
  description: Read-side API for retrieving task summaries and audit logs.
  version: 1.0.0

tags:
  - name: Tasks
    description: Operations related to task queries
  - name: History
    description: Operations related to task audit logs

paths:
  /tasks:
    get:
      summary: List all tasks
      description: Returns a list of task snapshots.
      operationId: getTaskSummaries
      tags:
        - Tasks
      responses:
        '200':
          description: A list of task summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskSummaryResponse'

  /tasks/{taskId}:
    get:
      summary: Get task by ID
      description: Retrieve a single task snapshot by its unique identifier.
      operationId: getTaskById
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task summary for the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummaryResponse'
        '404':
          description: Task not found.

  /tasks/{taskId}/history:
    get:
      summary: Get task audit log
      description: Returns the immutable history of all operations performed on a specific task.
      operationId: getTaskHistory
      tags:
        - History
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The audit trail for the task.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskHistoryResponse'
        '404':
          description: Task not found.

components:
  schemas:
    TaskSummaryResponse:
      type: object
      description: Task snapshot.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: "Implement authentication"
        description:
          type: string
          example: "Configure JWT and user roles"
        status:
          $ref: '#/components/schemas/Status'
        priority:
          $ref: '#/components/schemas/Priority'

    TaskHistoryResponse:
      type: object
      description: Immutable audit trail entry.
      properties:
        historyId:
          type: string
          format: uuid
        taskId:
          type: string
          format: uuid
        action:
          type: string
          example: "STATUS_UPDATED"
        timestamp:
          type: string
          format: date-time
          example: "2026-02-27T18:45:00Z"
        userId:
          type: string
          format: uuid

    Status:
      type: string
      enum: [TO_DO, IN_PROGRESS, DONE]

    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]
