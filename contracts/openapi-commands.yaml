openapi: 3.0.3
info:
  title: Task Management Command API
  description: Write-side API for task management based on the Task Management domain.
  version: 1.0.0
tags:
  - name: Tasks
    description: Operations related to task management commands
paths:
  /tasks:
    post:
      summary: Create a new task
      operationId: createTask
      tags:
        - Tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '201':
          description: Task successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          description: Invalid request body.

  /tasks/{taskId}/status:
    patch:
      summary: Update task status (updateStatus)
      operationId: updateTaskStatus
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  $ref: '#/components/schemas/Status'
      responses:
        '204':
          description: Status successfully updated
        '400':
          description: Invalid status value.
        '404':
          description: Task not found.

  /tasks/{taskId}/priority:
    patch:
      summary: Adjust task priority (adjustPriority)
      operationId: adjustTaskPriority
      tags:
        - Tasks
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                priority:
                  $ref: '#/components/schemas/Priority'
      responses:
        '204':
          description: Priority successfully adjusted
        '400':
          description: Invalid priority value.
        '404':
          description: Task not found.

components:
  schemas:
    TaskResponse:
      type: object
      required:
        - id
        - title
        - status
        - priority
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/Status'
        priority:
          $ref: '#/components/schemas/Priority'

    TaskRequest:
      type: object
      required:
        - title
        - priority
      properties:
        title:
          type: string
          example: "Implement authentication"
        description:
          type: string
          example: "Configure JWT and user roles"
        status:
          $ref: '#/components/schemas/Status'
        priority:
          $ref: '#/components/schemas/Priority'

    Status:
      type: string
      enum: [TO_DO, IN_PROGRESS, DONE]

    Priority:
      type: string
      enum: [LOW, MEDIUM, HIGH, URGENT]