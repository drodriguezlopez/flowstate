apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongodb-pv
  namespace: flowstate
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/mongodb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongodb-pvc
  namespace: flowstate
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: flowstate
  labels:
    app: mongodb
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: root
  MONGO_INITDB_ROOT_PASSWORD: rootpass
  MONGO_USERNAME: flowuser
  MONGO_PASSWORD: flowpass
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mongodb-initdb
  namespace: flowstate
  labels:
    app: mongodb
    component: initdb
data:
  init-user.js: |
    db = db.getSiblingDB('flowstate');
    db.createUser({
      user: 'flowuser',
      pwd: 'flowpass',
      roles: [
        { role: 'readWrite', db: 'flowstate' }
      ]
    });
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: flowstate
  labels:
    app: mongodb
spec:
  selector:
    matchLabels:
      app: mongodb
  replicas: 1
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:4.4
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGO_INITDB_ROOT_USERNAME
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: MONGO_INITDB_ROOT_PASSWORD
        - name: MONGO_INITDB_DATABASE
          value: flowstate
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongodb-persistent-storage
          mountPath: /data/db
        - name: mongodb-initdb
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: mongodb-persistent-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc
      - name: mongodb-initdb
        configMap:
          name: mongodb-initdb
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb-service
  namespace: flowstate
  labels:
    app: mongodb
spec:
  ports:
  - port: 27017
    targetPort: 27017
  selector:
    app: mongodb
