apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv
  namespace: flowstate
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/mysql
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
  namespace: flowstate
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: flowstate
spec:
  selector:
    matchLabels:
      app: mysql
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: rootpass
        - name: MYSQL_DATABASE
          value: flowstate
        - name: MYSQL_USER
          value: flowuser
        - name: MYSQL_PASSWORD
          value: flowpass
        ports:
        - containerPort: 3306
        volumeMounts:
        - name: mysql-persistent-storage
          mountPath: /var/lib/mysql
        - name: mysql-initdb
          mountPath: /docker-entrypoint-initdb.d
        - name: mysql-config
          mountPath: /etc/mysql/conf.d/my.cnf
          subPath: my.cnf
      volumes:
      - name: mysql-persistent-storage
        persistentVolumeClaim:
          claimName: mysql-pvc
      - name: mysql-initdb
        configMap:
          name: mysql-initdb
      - name: mysql-config
        configMap:
          name: mysql-config
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: flowstate
spec:
  ports:
  - port: 3306
  selector:
    app: mysql
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: flowstate
  labels:
    app: mysql
    component: initdb
data:
  init-grant.sql: |
    GRANT ALL PRIVILEGES ON flowstate.* TO 'flowuser'@'%';
    -- Debezium CDC requires global-level replication privileges.
    -- These are NOT included in a database-scoped ALL PRIVILEGES grant.
    GRANT REPLICATION CLIENT ON *.* TO 'flowuser'@'%';
    GRANT REPLICATION SLAVE ON *.* TO 'flowuser'@'%';
    -- Required by Debezium to execute FLUSH TABLES WITH READ LOCK during snapshots.
    GRANT RELOAD ON *.* TO 'flowuser'@'%';
    -- Needed so Debezium can read performance_schema for heartbeat / metrics.
    GRANT SELECT ON performance_schema.* TO 'flowuser'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: flowstate
  labels:
    app: mysql
    component: config
data:
  my.cnf: |
    [mysqld]
    log-bin=mysql-bin
    binlog_format=ROW
    server-id=1
