---
apiVersion: v1
kind: Namespace
metadata:
  name: flowstate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flowstate-db-config
  namespace: flowstate
data:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql-service:3306/flowstate
  SPRING_DATASOURCE_USERNAME: flowuser
  SPRING_DATASOURCE_PASSWORD: flowpass
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
  SPRING_JPA_HIBERNATE_DDL_AUTO: update
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowstate-command-handler
  namespace: flowstate
  labels:
    app: flowstate-command-handler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flowstate-command-handler
  template:
    metadata:
      labels:
        app: flowstate-command-handler
    spec:
      containers:
        - name: flowstate-command-handler
          image: registry.rodriguezrodero.com/flowstate-command-handler:latest
          ports:
            - name: httpport
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: flowstate-db-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: flowstate-db-config
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: flowstate-db-config
                  key: SPRING_DATASOURCE_PASSWORD
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              valueFrom:
                configMapKeyRef:
                  name: flowstate-db-config
                  key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              valueFrom:
                configMapKeyRef:
                  name: flowstate-db-config
                  key: SPRING_JPA_HIBERNATE_DDL_AUTO
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: flowstate-command-handler-service
  namespace: flowstate
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path:   /
    prometheus.io/port:   '8080'
spec:
  selector:
    app: flowstate-command-handler
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowstate-command-handler-ingress
  namespace: flowstate
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: fc.rodriguezrodero.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flowstate-command-handler-service
                port:
                  number: 8080