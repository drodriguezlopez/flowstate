apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: kafka
  labels:
    app: debezium-connect
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium-connect
  template:
    metadata:
      labels:
        app: debezium-connect
    spec:
      containers:
        - name: connect
          image: quay.io/debezium/connect:3.4.0.Final
          ports:
            - containerPort: 8083
          env:
            # Kafka broker
            - name: BOOTSTRAP_SERVERS
              value: kafka-service.kafka.svc.cluster.local:9092
            # Storage topics
            - name: CONFIG_STORAGE_TOPIC
              value: debezium_connect_config
            - name: OFFSET_STORAGE_TOPIC
              value: debezium_connect_offsets
            - name: STATUS_STORAGE_TOPIC
              value: debezium_connect_statuses
            # Replication factors
            - name: CONFIG_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: OFFSET_STORAGE_REPLICATION_FACTOR
              value: "1"
            - name: STATUS_STORAGE_REPLICATION_FACTOR
              value: "1"
            # Connector settings
            - name: GROUP_ID
              value: debezium-connect-group
            - name: CONNECTOR_CLIENT_CONFIG_OVERRIDE_POLICY
              value: All
            # REST settings
            - name: REST_HOST_NAME
              value: debezium-connect-service.kafka.svc.cluster.local
            - name: REST_PORT
              value: "8083"
            - name: ADVERTISED_HOST_NAME
              value: debezium-connect-service.kafka.svc.cluster.local
            - name: ADVERTISED_PORT
              value: "8083"
            # Converters
            - name: KEY_CONVERTER
              value: "org.apache.kafka.connect.storage.StringConverter"
            - name: VALUE_CONVERTER
              value: "org.apache.kafka.connect.json.JsonConverter"
            # Offset flush settings
            - name: OFFSET_FLUSH_INTERVAL_MS
              value: "60000"
            - name: OFFSET_FLUSH_TIMEOUT_MS
              value: "5000"
            # Shutdown settings
            - name: SHUTDOWN_TIMEOUT
              value: "10000"
---
apiVersion: v1
kind: Service
metadata:
  name: debezium-connect-service
  namespace: kafka
spec:
  selector:
    app: debezium-connect
  ports:
    - name: rest
      protocol: TCP
      port: 8083
      targetPort: 8083
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: debezium-connect-ingress
  namespace: kafka
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: cdc.rodriguezrodero.com
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: debezium-connect-service
                port:
                  number: 8083
