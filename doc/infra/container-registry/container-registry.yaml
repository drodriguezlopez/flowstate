apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry
  namespace: devops-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
        - name: registry
          image: registry:2
          ports:
            - containerPort: 5000
          # Opcional: Esto guarda las imágenes en el disco del nodo para no perderlas al reiniciar
          volumeMounts:
            - name: storage
              mountPath: /var/lib/registry
      volumes:
        - name: storage
          hostPath:
            path: /mnt/data/registry
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: registry-service
  namespace: devops-tools
spec:
  type: NodePort
  selector:
    app: registry
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500